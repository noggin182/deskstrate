; kb: the XIAO ESP32S3 Plus inside the Keychron Q3 Max keyboard. Joins Wi-Fi as deskstrate-kb,
; talks to the keyboard's STM32 over a UART and sleeps while the keyboard has no USB.
;   pio run -d firmware/kb -t upload --upload-port COMx
[platformio]
src_dir = src
default_envs = xiao_s3

[env:xiao_s3]
; Pinned so CI builds with the same ESP-IDF (6.1.0) as the bench PC.
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
; Seeed XIAO ESP32S3 Plus (16MB flash; the 4MB layout below only uses the first 4MB).
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; One OTA slot (0x1F0000, see partitions.csv).
board_upload.maximum_size = 2031616
board_build.partitions = partitions.csv
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
; Debug over the S3's built-in USB JTAG (same cable as flashing): PlatformIO's Run and
; Debug view, with this folder open (deskstrate.code-workspace has one per board).
debug_tool = esp-builtin
