; radio_test: ESP-NOW range test for the ESP32 inside the keyboard.
; Flash "sender" onto the keyboard's S3 Mini, close the case, and watch "receiver"'s
; console on a bench S3 Mini at the core's spot on the desk.
;   pio run -d firmware/radio_test -e sender -t upload --upload-port COMx
;   pio run -d firmware/radio_test -e receiver -t upload -t monitor --upload-port COMy
; Both must use the same channel. Set it to your access point's channel (the one the
; core sits on) to test the real thing; the *_lr envs try ESP-NOW long-range mode.
[platformio]
src_dir = src
default_envs = sender, receiver

[env]
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
build_flags = -DRADIO_TEST_CHANNEL=1

[env:sender]
build_flags = ${env.build_flags} -DRADIO_TEST_SENDER=1

[env:receiver]
build_flags = ${env.build_flags} -DRADIO_TEST_SENDER=0

[env:sender_lr]
build_flags = ${env.build_flags} -DRADIO_TEST_SENDER=1 -DRADIO_TEST_LR=1

[env:receiver_lr]
build_flags = ${env.build_flags} -DRADIO_TEST_SENDER=0 -DRADIO_TEST_LR=1
