; swd_dump: read-only SWD flash dumper for a hub's PY32F002A, run from an ESP32-S3 Mini.
;   pio run -d firmware/swd_dump -t upload
[platformio]
src_dir = src
default_envs = s3_mini

[env:s3_mini]
platform = espressif32
framework = espidf
monitor_speed = 115200
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
