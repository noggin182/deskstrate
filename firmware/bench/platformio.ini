; bench: a "signs of life" image for the bench ESP32-S3 Mini. Joins Wi-Fi as esp-bench,
; cycles a rainbow on the WS2812 and serves a hello-world page. No OTA, no sleep.
;   pio run -d firmware/bench -t upload --upload-port COMx
[platformio]
src_dir = src
default_envs = s3_mini

[env:s3_mini]
; Pinned to the same ESP-IDF (6.1.0) as core, deck and kb.
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
; ESP32-S3 Mini (S3-Zero layout, 4MB flash). No dedicated PlatformIO board for it.
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
