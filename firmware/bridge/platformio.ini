; bridge: an S3 Super Mini on the Mac's dock. Passes kvm_proto between the Mac's USB
; serial port and UDP 18200, so the Mac (on a work VPN) never touches the LAN itself.
;   pio run -d firmware/bridge -t upload --upload-port COMx
[platformio]
src_dir = src
default_envs = s3_mini

[env:s3_mini]
; Pinned so CI builds with the same ESP-IDF (6.1.0) as the bench PC.
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; One OTA slot (0x1F0000, see partitions.csv).
board_upload.maximum_size = 2031616
board_build.partitions = partitions.csv
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
debug_tool = esp-builtin
