; core: the central box. Headless source of truth: DDC to both monitors,
; SWD to both USB hubs, UDP server for the deck and host daemons.
;   pio run -d firmware/core -e feather_bench   Feather ESP32-S3 TFT on the bench
;   pio run -d firmware/core -e s3_mini         diymore ESP32-S3 Mini (final box)
[platformio]
src_dir = src
default_envs = feather_bench

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

[env:feather_bench]
board = adafruit_feather_esp32s3_tft
build_flags = -DDESKSTRATE_BOARD_FEATHER_BENCH

[env:s3_mini]
; Generic S3 board until the Mini's chip and flash are confirmed (esptool.py chip_id).
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = -DDESKSTRATE_BOARD_S3_MINI
