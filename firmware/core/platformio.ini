; core: the central box. Headless source of truth: DDC to both monitors,
; SWD to both USB hubs, UDP server for the deck and host daemons.
;   pio run -d firmware/core   diymore ESP32-S3 Mini (final box)
[platformio]
src_dir = src
default_envs = s3_mini

[env]
; Pinned so CI builds with the same ESP-IDF (6.1.0) as the bench PC.
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200


[env:s3_mini]
; Chip confirmed with esptool: ESP32-S3FH4R2 (4MB embedded flash, 2MB embedded PSRAM).
; No dedicated PlatformIO board for the Mini, so use the generic S3 devkit.
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; One OTA slot (0x1F0000, see partitions.csv).
board_upload.maximum_size = 2031616
board_build.partitions = partitions.csv
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
