; deck: the desk unit (Feather ESP32-S3 TFT + 2x NeoKey FeatherWing).
; Build: pio run -d firmware/deck
[platformio]
src_dir = src

[env:adafruit_feather_esp32s3_tft]
platform = espressif32
board = adafruit_feather_esp32s3_tft
framework = espidf
monitor_speed = 115200
; 4MB embedded flash (confirmed with esptool); the 1MB single-app default is too small.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
