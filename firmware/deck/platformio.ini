; deck: the desk unit (Feather ESP32-S3 TFT + 2x NeoKey FeatherWing).
; Build: pio run -d firmware/deck
[platformio]
src_dir = src

[env:adafruit_feather_esp32s3_tft]
; Pinned so CI builds with the same ESP-IDF (6.1.0) as the bench PC.
platform = espressif32@7.1.3
board = adafruit_feather_esp32s3_tft
framework = espidf
monitor_speed = 115200
; 4MB embedded flash (confirmed with esptool), split into two OTA slots (partitions.csv).
board_upload.flash_size = 4MB
; One OTA slot (0x1F0000).
board_upload.maximum_size = 2031616
board_build.partitions = partitions.csv
; hard_reset over USB Serial/JTAG leaves the S3 in the ROM bootloader; this boots the app.
board_upload.after_reset = watchdog_reset
