# Builds the host daemons (host/) and runs the shared policy's and kvm_controls' tests. The images are kept
# as artifacts of each run; nothing is deployed (the hosts are installed by hand, see
# host/README.md).
name: "Host daemons: Windows, Mac"

on:
  push:
    paths: [host/**, components/kvm_proto/**, components/kvm_controls/**, .github/workflows/host.yml]
  pull_request:
    paths: [host/**, components/kvm_proto/**, components/kvm_controls/**, .github/workflows/host.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test host_policy.h
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I components/kvm_proto/include -I host/common \
            host/common/test_host_policy.cpp -o test_host_policy
          ./test_host_policy
      - name: Test kvm_controls (the deck's and keyboard's key rules)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I components/kvm_proto/include -I components/kvm_controls/include \
            components/kvm_controls/kvm_controls.cpp components/kvm_controls/test/test_kvm_controls.cpp -o test_kvm_controls
          ./test_kvm_controls

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S host/windows -B build -A x64
          cmake --build build --config Release
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build/Release/deskstrate-host.exe, host/windows/install.ps1 out/
      - uses: actions/upload-artifact@v4
        with:
          name: deskstrate-host-windows
          path: out/
          if-no-files-found: error

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C host/mac
      - uses: actions/upload-artifact@v4
        with:
          name: deskstrate-host-mac
          path: host/mac/build/deskstrate-host
          if-no-files-found: error
