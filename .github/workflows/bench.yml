# Builds the bench tools under firmware/ (bench, radio_test, swd_dump) so they're known to
# compile. Nothing is released: they're flashed by hand (see each project's
# platformio.ini). Separate from firmware.yml so that changing them never rebuilds or
# releases the core, deck or kb.
name: "Bench tools: bench, radio_test, swd_dump"

on:
  push:
    paths: &paths
      - firmware/bench/**
      - firmware/radio_test/**
      - firmware/swd_dump/**
      - components/**
      - .github/actions/setup-idf/**
      - .github/workflows/bench.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-idf
      - name: Build
        run: |
          set -euo pipefail
          build() {  # <project> [build dir] [cmake -D options...]
            dir=firmware/$1; bdir=${2:-build}; shift 2 || shift
            echo "::group::$dir ($bdir)"
            # Sources are in src/ (the PlatformIO layout), so add it as a component.
            python "$IDF_PATH/tools/idf.py" -C "$dir" -B "$dir/$bdir" \
              -DEXTRA_COMPONENT_DIRS="$PWD/$dir/src" "$@" build
            echo "::endgroup::"
          }
          build bench
          build swd_dump
          # The same variants as radio_test's platformio.ini envs.
          build radio_test build-sender      -DRADIO_TEST_SENDER=1
          build radio_test build-receiver    -DRADIO_TEST_SENDER=0
          build radio_test build-sender_lr   -DRADIO_TEST_SENDER=1 -DRADIO_TEST_LR=1
          build radio_test build-receiver_lr -DRADIO_TEST_SENDER=0 -DRADIO_TEST_LR=1
