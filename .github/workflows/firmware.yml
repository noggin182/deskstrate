# Builds the core, deck and kb (the ESP inside the keyboard) firmware. Pushes to main are published as a
# GitHub release and the boards' doorbells are rung, so they pull the new images themselves
# (components/ota_pull/include/ota_pull.h). No secrets: Wi-Fi credentials and the core's
# OTA push token live in each board's NVS.
#
# Kept fast for iterating on one board:
# - Only boards whose sources changed are built (firmware/<board>/, the shared
#   components/, or this workflow). The other boards' images are reused from the previous
#   release, so their versions don't change and they don't reboot. Pushes that touch
#   none of those build nothing.
# - Each board's build directory is cached, so a build only recompiles what changed.
# - Plain ESP-IDF (every firmware here is an ESP-IDF CMake project), installed with only
#   the tools a build needs and cached. platformio.ini is kept for flashing on the bench.
# - The release is published and the doorbells rung before any cache is saved.
# Run it by hand with "rebuild" to build every board from scratch.
# The keyboard's own QMK firmware is keyboard.yml. Bench tools (bench, radio_test,
# swd_dump) aren't built in CI.
name: "Firmware: core, deck, kb (release + OTA)"

on:
  # Only when something a board image is built or released from changes. A push that
  # skips this workflow is still covered: the next one compares against the last release.
  push:
    paths: &paths
      - firmware/core/**
      - firmware/deck/**
      - firmware/kb/**
      - components/**
      - tools/release_manifest.py
      - tools/doorbell.py
      - .github/workflows/firmware.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every board, even if their sources didn't change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  # Never cancel a main run halfway through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # publish the release (main only; fork PRs get a read-only token)
    env:
      DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
      TAG: build-${{ github.run_number }}.${{ github.run_attempt }}
      # ESP-IDF release (a tag of espressif/esp-idf) and the tools installed from it.
      # Change either to rebuild the toolchain cache.
      IDF_VERSION: v6.1
      IDF_TOOLS: xtensa-esp-elf cmake ninja
      IDF_TARGET: esp32s3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history and tags: change detection, and git describe for the app version

      - name: Decide what to build
        id: plan
        run: |
          set -euo pipefail
          prev=""
          if [ "$DEPLOY" = true ]; then
            # Compare against what the boards are running: the latest release.
            prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            base=$prev
          elif [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          else
            base=$(git merge-base HEAD origin/main 2>/dev/null || true)
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          any=false
          for board in core deck kb; do
            if [ "${{ inputs.rebuild }}" = true ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              build=true
            elif git diff --quiet "$base" HEAD -- "firmware/$board" components .github/workflows/firmware.yml; then
              build=false
            else
              build=true
            fi
            echo "$board=$build" >> "$GITHUB_OUTPUT"
            [ "$build" = true ] && any=true
            echo "$board: build=$build (base ${base:-none})"
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Cache ESP-IDF
        id: idf-cache
        if: steps.plan.outputs.any == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: idf-${{ runner.os }}-${{ env.IDF_VERSION }}-${{ env.IDF_TOOLS }}

      - name: Install ESP-IDF
        # Only what a build needs: the ESP-IDF tree, the Xtensa compiler, CMake, Ninja and
        # the Python env. install.sh would also fetch gdb, OpenOCD, the RISC-V and ULP
        # toolchains and more, none of which CI uses.
        if: steps.plan.outputs.any == 'true' && steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$IDF_VERSION" --recurse-submodules --shallow-submodules --jobs 8 \
            https://github.com/espressif/esp-idf ~/esp-idf
          python3 ~/esp-idf/tools/idf_tools.py install $IDF_TOOLS
          python3 ~/esp-idf/tools/idf_tools.py install-python-env
          rm -rf ~/.espressif/dist  # the downloaded archives, already unpacked

      - name: Cache core build
        if: steps.plan.outputs.core == 'true'
        uses: actions/cache@v4
        with:
          path: |
            firmware/core/build
            firmware/core/managed_components
            firmware/core/sdkconfig
          key: build-core-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/core/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: build-core-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/core/sdkconfig.defaults') }}-

      - name: Cache deck build
        if: steps.plan.outputs.deck == 'true'
        uses: actions/cache@v4
        with:
          path: |
            firmware/deck/build
            firmware/deck/managed_components
            firmware/deck/sdkconfig
          key: build-deck-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/deck/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: build-deck-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/deck/sdkconfig.defaults') }}-

      - name: Cache kb build
        if: steps.plan.outputs.kb == 'true'
        uses: actions/cache@v4
        with:
          path: |
            firmware/kb/build
            firmware/kb/managed_components
            firmware/kb/sdkconfig
          key: build-kb-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/kb/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: build-kb-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/kb/sdkconfig.defaults') }}-

      - name: Name the build after its release
        # The app version is git describe at build time, but the release tag only exists
        # once the build is done, so a main build used to describe itself relative to the
        # previous tag ("build-58.1-2-gf367e8d" for release build-59.1). Tag HEAD locally
        # first so the firmware version is the release name. Branches and PRs keep the
        # describe form.
        if: env.DEPLOY == 'true'
        run: git tag -f "$TAG"

      - name: Build
        run: |
          set -euo pipefail
          # What export.sh would set. export.sh itself refuses to run without every tool
          # install.sh would have installed (gdb, OpenOCD, ...), so set it by hand.
          export IDF_PATH=~/esp-idf
          export IDF_PYTHON_ENV_PATH=$(echo ~/.espressif/python_env/idf*_env)
          export ESP_IDF_VERSION=$(basename "$IDF_PYTHON_ENV_PATH" | sed -E 's/^idf([0-9.]+)_py.*/\1/')
          export PATH="$(echo ~/.espressif/tools/xtensa-esp-elf/*/xtensa-esp-elf/bin):$(echo ~/.espressif/tools/cmake/*/bin):$(echo ~/.espressif/tools/ninja/*):$IDF_PYTHON_ENV_PATH/bin:$PATH"
          build() {  # <board>
            dir=firmware/$1
            # CMake always re-runs (a fresh checkout looks newer than the cache): that is
            # where git describe stamps the app version the boards compare against the
            # manifest. Skipping it left build-8.1 with build-7.1's version, so neither
            # board installed it. Objects still come from the cache.
            # Sources are in src/ rather than ESP-IDF's main/ (the PlatformIO layout), so
            # add it as a component the way PlatformIO does.
            python "$IDF_PATH/tools/idf.py" -C "$dir" -DEXTRA_COMPONENT_DIRS="$PWD/$dir/src" build
            cp "$dir/build/deskstrate_$1.bin" "images/$1.bin"
            touch "images/.rebuilt-$1"
          }
          mkdir -p images
          if [ "${{ steps.plan.outputs.core }}" = true ]; then build core; fi
          if [ "${{ steps.plan.outputs.deck }}" = true ]; then build deck; fi
          if [ "${{ steps.plan.outputs.kb }}" = true ]; then build kb; fi

      - name: Upload images
        if: steps.plan.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: images/
          if-no-files-found: error

      - name: Publish release
        id: release
        if: env.DEPLOY == 'true' && steps.plan.outputs.any == 'true'
        run: |
          set -euo pipefail
          # A board that wasn't rebuilt keeps the image (and so the version) it already runs.
          prev="${{ steps.plan.outputs.prev }}"
          for board in core deck kb; do
            if [ ! -f "images/$board.bin" ]; then
              gh release download "$prev" -p "deskstrate_$board.bin" -O "images/$board.bin"
              echo "$board: reusing image from $prev"
            fi
          done
          python3 tools/release_manifest.py "$TAG" release images/core.bin images/deck.bin images/kb.bin
          # A rebuilt board whose version didn't change would never install it (the boards
          # compare versions), so don't publish one. (A re-run of the same commit is fine.)
          if [ -n "$prev" ] && [ "$(git rev-list -n1 "$prev" 2>/dev/null)" != "$GITHUB_SHA" ] &&
             gh release download "$prev" -p manifest.txt -O prev-manifest.txt; then
            for board in core deck kb; do
              [ -f "images/.rebuilt-$board" ] || continue
              line=$(grep "^deskstrate_$board=" release/manifest.txt)
              if grep -qxF "$line" prev-manifest.txt; then
                echo "::error::$board was rebuilt but its version is unchanged from $prev ($line)"
                exit 1
              fi
            done
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "$TAG" --latest \
            --notes "Firmware for ${GITHUB_SHA::7}. Rebuilt: core=${{ steps.plan.outputs.core }}, deck=${{ steps.plan.outputs.deck }}, kb=${{ steps.plan.outputs.kb }}."

      - name: Ring doorbells
        # The boards also poll hourly, so a missed ring only delays the update.
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          # GitHub's latest-release link lags a new release by a few seconds. A board rung
          # before it moves reads the previous manifest and installs that release instead
          # (seen with build-2.1), so wait until the link serves this release's manifest.
          url="https://github.com/${{ github.repository }}/releases/latest/download/manifest.txt"
          for i in $(seq 1 60); do
            if curl -fsSL "$url" | grep -qx "tag=$TAG"; then echo "latest is $TAG after ${i} tries"; break; fi
            sleep 2
          done
          python3 tools/doorbell.py "${{ vars.DOORBELL_HOST || 'deskstrate.nogsnet.com' }}" 18210 18211 18212

      - name: Prune old releases
        # Every release carries all three images, so only the latest is needed for OTA.
        # Keep the newest 10 build-* releases (and their tags) for reference.
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
