# Builds the core and deck firmware. Pushes to main are published as a GitHub release and
# the boards' doorbells are rung, so they pull the new images themselves
# (components/ota_pull/include/ota_pull.h). No secrets: Wi-Fi credentials and the core's
# OTA push token live in each board's NVS.
#
# Kept fast for iterating on one board:
# - Only boards whose sources changed are built (firmware/<board>/, the shared
#   components/, or this workflow). The other board's image is reused from the previous
#   release, so its version doesn't change and it doesn't reboot. Pushes that touch
#   none of those build nothing.
# - Each board's build directory is cached, so a build only recompiles what changed.
# - The release is published and the doorbells rung before any cache is saved.
# Run it by hand with "rebuild" to build both boards from scratch.
name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build both boards, even if their sources didn't change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  # Never cancel a main run halfway through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # publish the release (main only; fork PRs get a read-only token)
    env:
      DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
      TAG: build-${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history and tags: change detection, and git describe for the app version

      - name: Decide what to build
        id: plan
        run: |
          set -euo pipefail
          prev=""
          if [ "$DEPLOY" = true ]; then
            # Compare against what the boards are running: the latest release.
            prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            base=$prev
          elif [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          else
            base=$(git merge-base HEAD origin/main 2>/dev/null || true)
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          for board in core deck; do
            if [ "${{ inputs.rebuild }}" = true ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              build=true
            elif git diff --quiet "$base" HEAD -- "firmware/$board" components .github/workflows/firmware.yml; then
              build=false
            else
              build=true
            fi
            echo "$board=$build" >> "$GITHUB_OUTPUT"
            echo "$board: build=$build (base ${base:-none})"
          done

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.core == 'true' || steps.plan.outputs.deck == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Cache toolchain
        if: steps.plan.outputs.core == 'true' || steps.plan.outputs.deck == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/*/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        if: steps.plan.outputs.core == 'true' || steps.plan.outputs.deck == 'true'
        run: pip install -r tools/requirements-ci.txt

      - name: Cache core build
        if: steps.plan.outputs.core == 'true'
        uses: actions/cache@v4
        with:
          path: |
            firmware/core/.pio
            firmware/core/managed_components
            firmware/core/sdkconfig.s3_mini
          key: build-core-${{ hashFiles('firmware/core/platformio.ini', 'firmware/core/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: build-core-${{ hashFiles('firmware/core/platformio.ini', 'firmware/core/sdkconfig.defaults') }}-

      - name: Cache deck build
        if: steps.plan.outputs.deck == 'true'
        uses: actions/cache@v4
        with:
          path: |
            firmware/deck/.pio
            firmware/deck/managed_components
            firmware/deck/sdkconfig.adafruit_feather_esp32s3_tft
          key: build-deck-${{ hashFiles('firmware/deck/platformio.ini', 'firmware/deck/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: build-deck-${{ hashFiles('firmware/deck/platformio.ini', 'firmware/deck/sdkconfig.defaults') }}-

      - name: Build
        run: |
          set -euo pipefail
          build() {  # <board> <env>
            dir=firmware/$1
            # CMake always re-runs (a fresh checkout looks newer than the cache): that is
            # where git describe stamps the app version the boards compare against the
            # manifest. Skipping it left build-8.1 with build-7.1's version, so neither
            # board installed it. Objects still come from the cache.
            pio run -d "$dir" -e "$2"
            cp "$dir/.pio/build/$2/firmware.bin" "images/$1.bin"
          }
          mkdir -p images
          if [ "${{ steps.plan.outputs.core }}" = true ]; then build core s3_mini; fi
          if [ "${{ steps.plan.outputs.deck }}" = true ]; then build deck adafruit_feather_esp32s3_tft; fi

      - name: Upload images
        if: steps.plan.outputs.core == 'true' || steps.plan.outputs.deck == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: images/
          if-no-files-found: error

      - name: Publish release
        id: release
        if: env.DEPLOY == 'true' && (steps.plan.outputs.core == 'true' || steps.plan.outputs.deck == 'true')
        run: |
          set -euo pipefail
          # A board that wasn't rebuilt keeps the image (and so the version) it already runs.
          prev="${{ steps.plan.outputs.prev }}"
          for board in core deck; do
            if [ ! -f "images/$board.bin" ]; then
              gh release download "$prev" -p "deskstrate_$board.bin" -O "images/$board.bin"
              echo "$board: reusing image from $prev"
            fi
          done
          python3 tools/release_manifest.py "$TAG" release images/core.bin images/deck.bin
          # A rebuilt board whose version didn't change would never install it (the boards
          # compare versions), so don't publish one. (A re-run of the same commit is fine.)
          if [ -n "$prev" ] && [ "$(git rev-list -n1 "$prev" 2>/dev/null)" != "$GITHUB_SHA" ] &&
             gh release download "$prev" -p manifest.txt -O prev-manifest.txt; then
            for board in core deck; do
              if [ "$board" = core ]; then rebuilt=${{ steps.plan.outputs.core }}; else rebuilt=${{ steps.plan.outputs.deck }}; fi
              [ "$rebuilt" = true ] || continue
              line=$(grep "^deskstrate_$board=" release/manifest.txt)
              if grep -qxF "$line" prev-manifest.txt; then
                echo "::error::$board was rebuilt but its version is unchanged from $prev ($line)"
                exit 1
              fi
            done
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "$TAG" --latest \
            --notes "Firmware for ${GITHUB_SHA::7}. Rebuilt: core=${{ steps.plan.outputs.core }}, deck=${{ steps.plan.outputs.deck }}."

      - name: Ring doorbells
        # The boards also poll hourly, so a missed ring only delays the update.
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          # GitHub's latest-release link lags a new release by a few seconds. A board rung
          # before it moves reads the previous manifest and installs that release instead
          # (seen with build-2.1), so wait until the link serves this release's manifest.
          url="https://github.com/${{ github.repository }}/releases/latest/download/manifest.txt"
          for i in $(seq 1 60); do
            if curl -fsSL "$url" | grep -qx "tag=$TAG"; then echo "latest is $TAG after ${i} tries"; break; fi
            sleep 2
          done
          python3 tools/doorbell.py "${{ vars.DOORBELL_HOST || 'deskstrate.nogsnet.com' }}" 18210 18211
