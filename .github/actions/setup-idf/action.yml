# Installs plain ESP-IDF with only what a build needs (the ESP-IDF tree, the Xtensa
# compiler, CMake, Ninja and the Python env), cached, and sets up the environment for the
# rest of the job, so later steps can just run `idf.py`. install.sh would also fetch gdb,
# OpenOCD, the RISC-V and ULP toolchains and more, none of which CI uses.
# Used by firmware.yml and bench.yml. Change idf-version to rebuild the cache.
name: Set up ESP-IDF
description: Install a minimal, cached ESP-IDF and export its environment

inputs:
  idf-version:
    description: ESP-IDF release (a tag of espressif/esp-idf)
    default: v6.1
  target:
    description: IDF_TARGET for the builds
    default: esp32s3

runs:
  using: composite
  steps:
    - name: Cache ESP-IDF
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/esp-idf
          ~/.espressif
        key: idf-${{ runner.os }}-${{ inputs.idf-version }}-xtensa-esp-elf cmake ninja

    - name: Install ESP-IDF
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        IDF_VERSION: ${{ inputs.idf-version }}
      run: |
        set -euo pipefail
        git clone --quiet --depth 1 --branch "$IDF_VERSION" --recurse-submodules --shallow-submodules --jobs 8 \
          https://github.com/espressif/esp-idf ~/esp-idf
        python3 ~/esp-idf/tools/idf_tools.py install xtensa-esp-elf cmake ninja
        python3 ~/esp-idf/tools/idf_tools.py install-python-env
        rm -rf ~/.espressif/dist  # the downloaded archives, already unpacked

    - name: Export ESP-IDF environment
      # What export.sh would set. export.sh itself refuses to run without every tool
      # install.sh would have installed (gdb, OpenOCD, ...), so set it by hand.
      shell: bash
      run: |
        set -euo pipefail
        env_path=$(echo ~/.espressif/python_env/idf*_env)
        {
          echo "IDF_PATH=$HOME/esp-idf"
          echo "IDF_TARGET=${{ inputs.target }}"
          echo "IDF_PYTHON_ENV_PATH=$env_path"
          echo "ESP_IDF_VERSION=$(basename "$env_path" | sed -E 's/^idf([0-9.]+)_py.*/\1/')"
        } >> "$GITHUB_ENV"
        {
          echo "$env_path/bin"
          echo ~/.espressif/tools/ninja/*
          echo ~/.espressif/tools/cmake/*/bin
          echo ~/.espressif/tools/xtensa-esp-elf/*/xtensa-esp-elf/bin
        } >> "$GITHUB_PATH"
